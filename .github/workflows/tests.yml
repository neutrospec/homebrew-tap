name: brew test-bot

# Builds and tests bottles for the formulae a pull request changes, from
# Homebrew's `brew tap-new` template. Only pull requests that change
# Formula/cuttle.rb run it: pushes to main, such as the canopy release bot's,
# run audit.yml alone, and canopy builds from source by design.
#
# The matrix gives the arm64_sequoia and arm64_tahoe bottle tags. A newer
# macOS pours the newest older tag, and Intel Macs build from source.
# xcode-27 (macOS 27) stays out of the matrix: as the only runner newer
# than every bottle tag, it proves that fallback in install-check.yml.
# publish.yml uploads the bottles of a bump-cuttle-<version> pull request
# once this workflow is green.
on:
  pull_request:
    paths:
      - Formula/cuttle.rb

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
